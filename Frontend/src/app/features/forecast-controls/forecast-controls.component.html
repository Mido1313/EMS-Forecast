<aside class="controls" aria-label="Prognoseeinstellungen">
  <section class="control-block hero-control">
    <span class="eyebrow">Prognosehorizont</span>
    <strong>{{ horizonLabel() }}</strong>

    <input
      type="range"
      min="0"
      [max]="forecastSteps().length - 1"
      [value]="horizonIndex()"
      (input)="onSliderInput($event)"
      aria-label="Prognosehorizont"
    />

    <div class="range-labels" aria-hidden="true">
      <span>1h</span>
      <span>24h</span>
      <span>7 Tage</span>
      <span>30 Tage</span>
    </div>
  </section>

  <section class="control-block">
    <span class="select-label" id="incidentFocusLabel">Einsatztyp-Fokus</span>
    <div class="incident-select" [class.is-open]="isIncidentMenuOpen()">
      <button
        type="button"
        class="incident-trigger"
        aria-haspopup="listbox"
        [attr.aria-expanded]="isIncidentMenuOpen()"
        aria-labelledby="incidentFocusLabel"
        (click)="toggleIncidentMenu($event)"
      >
        <span class="incident-icon">
          <lucide-icon [img]="selectedIncidentOption().icon" size="18" />
        </span>
        <span>{{ selectedIncidentOption().type }}</span>
        <lucide-icon class="chevron" [img]="chevronDownIcon" size="18" />
      </button>

      @if (isIncidentMenuOpen()) {
        <div class="incident-menu" role="listbox" aria-labelledby="incidentFocusLabel">
          @for (option of incidentOptions(); track option.type) {
            <button
              type="button"
              class="incident-option"
              role="option"
              [class.is-selected]="option.type === incidentFocus()"
              [attr.aria-selected]="option.type === incidentFocus()"
              (click)="selectIncidentOption(option, $event)"
            >
              <span class="incident-icon">
                <lucide-icon [img]="option.icon" size="17" />
              </span>
              <span>{{ option.type }}</span>
              @if (option.type === incidentFocus()) {
                <lucide-icon class="check" [img]="checkIcon" size="17" />
              }
            </button>
          }
        </div>
      }
    </div>
  </section>

  <section class="control-block comparison-block">
    <span class="select-label">Vergleichszeitraum</span>
    <div class="segmented-control" role="group" aria-label="Vergleichszeitraum">
      @for (option of comparisonPeriods(); track option.value) {
        <button
          type="button"
          [class.is-active]="option.value === comparisonPeriod()"
          (click)="selectComparisonPeriod(option.value)"
        >
          {{ option.label }}
        </button>
      }
    </div>
  </section>

  <section class="control-block">
    <app-risk-legend />
  </section>
</aside>
